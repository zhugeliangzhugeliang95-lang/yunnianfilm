<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>产品内容后台 | YUNNIAN</title><link rel="icon" href="/yunnian-favicon-v10.webp"><link rel="stylesheet" href="/manage/editor.css">
</head><body>
<header><a href="/zh/" aria-label="云辇官网"><img src="/images/yunnian-logo-white.webp" alt="YUNNIAN" width="147" height="37"></a><span>产品内容后台</span><div id="account" hidden><span id="account-name"></span><button id="logout" type="button">退出</button></div></header>
<main>
  <section id="access" class="access" hidden><h1 id="access-title">登录产品后台</h1><p id="access-intro"></p>
    <form id="login-form"><label>登录账号<input id="login-name" autocomplete="username" required minlength="2" maxlength="100"></label><label>密码<input id="login-password" type="password" autocomplete="current-password" required maxlength="200"></label>
    <button class="primary" id="login-submit">登录</button></form>
  </section>
  <div id="workspace" class="workspace" hidden>
    <aside><h2>内容管理</h2><button class="nav" id="product-nav" aria-pressed="true">产品目录</button><button class="nav" id="stories-nav" aria-pressed="false">客户案例与评价</button><a href="/zh/products/" target="_blank" rel="noopener">查看官网产品</a></aside>
    <section class="desk" aria-label="内容编辑"><div class="desk-head"><div><h1 id="title">产品目录</h1><p id="subtitle"></p></div><div id="head-actions"></div></div>
      <div id="items"></div><form id="editing" hidden novalidate><div id="fields"></div>
      <div class="savebar"><span id="state"></span><button type="button" data-action="save">保存草稿</button><button type="button" data-action="preview">预览</button><button type="button" class="primary" data-action="publish">发布到官网</button></div>
      </form><div id="live-link"></div>
    </section>
  </div>
  <p id="status" role="status" aria-live="polite">正在连接后台…</p>
</main>
<dialog id="story-preview"><div class="dialog-title"><h2>案例与评价预览</h2><button id="preview-close" type="button">关闭</button></div><div id="preview-stories"></div></dialog>
<script type="module" src="/manage/editor.js"></script>
</body></html>
